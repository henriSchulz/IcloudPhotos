[package]
name = "icloud-photos-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_12"] }
icloud-photos-cache.workspace = true
icloud-photos-core.workspace = true
icloud-photos-sync.workspace = true
kamadak-exif = "0.6.1"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3.27.0"
