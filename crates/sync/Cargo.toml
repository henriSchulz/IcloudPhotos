[package]
name = "icloud-photos-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
icloud-photos-cache.workspace = true
icloud-photos-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["process", "io-util", "rt", "macros", "time", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
tracing-subscriber = "0.3.23"
